name: Cargo Linter Check

on:
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      RISC0_DEV_MODE: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install taplo
        run: |
          cargo install taplo-cli

      - name: Run lint checks
        run: |
          cargo fmt -- --check
          taplo fmt --check
