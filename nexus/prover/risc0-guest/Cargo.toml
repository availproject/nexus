[package]
name              = "nexus_runtime"
version.workspace = true
edition           = "2021"

[dependencies]
# If you want to try (experimental) std support, add `features = [ "std" ]` to risc0-zkvm
risc0-zkvm = { version = "2.0.2", default-features = false, features = [
    "std",
] }
nexus-core = { path = "../../../core", default-features = false, features = [
    "zkvm-risc0",
] }
risc0-zkvm-platform = { version = "2.0.2", features = [ "sys-getenv" ] }
