[package]
name = "ethereum-adapter-host"
version = "0.1.0"
edition = "2021"

[dependencies]
ethereum-adapter-methods = { path = "../methods", default-features = false }
risc0-zkvm = { version = "1.2.0" , default-features = false, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15.0"
clap = "4.5.9"
env_logger = "0.11.3"
tokio = "1.36.0"
helios-consensus-core = { workspace = true }
helios-ethereum = { workspace = true }
serde = { workspace = true }
serde_cbor = "0.11.2"
log = "0.4.22"
alloy-primitives = { workspace = true }
alloy = { workspace = true }
anyhow = { workspace = true }
cargo_metadata = "0.18"
reqwest = { workspace = true }
tree_hash = { workspace = true }
serde_json = { workspace = true }
nexus-core = { path = "../../../core", default-features = false, optional = true }
adapter_sdk = { path = "../../../adapter_sdk", default-features = false }
ethereum-adapter-core = { path = "../ethereum_adapter_core", default-features = false }
sp1-sdk = { version = "4.1.0" , optional = true }
derive_more = { git = "https://github.com/JelteF/derive_more", tag = "v1.0.0", features = ["display"] }

[features]
default = ["risc0"]
sp1 = ["sp1-sdk", "nexus-core/native" , "ethereum-adapter-methods/sp1" , "ethereum-adapter-core/sp1" , "adapter_sdk/zkvm-sp1"]
risc0 = ["risc0-zkvm/std", "nexus-core/native" , "ethereum-adapter-methods/risc0" , "ethereum-adapter-core/risc0" , "adapter_sdk/zkvm-risc0"]
cuda = ["risc0-zkvm/cuda"]